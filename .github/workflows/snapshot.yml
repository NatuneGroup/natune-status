name: Snapshot listener status

# Pulls the live aggregate from the API and commits it as docs/status.json, then publishes docs/ through
# the GitHub Pages actions — a GITHUB_TOKEN push alone does not trigger a Pages build. This keeps every
# map view on static hosting instead of the Worker quota. Requires repo Settings → Pages → "Source:
# GitHub Actions" (configure-pages also enables it on first run) and the STATUS_API_URL variable.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: status-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Fetch live status
        env:
          STATUS_API_URL: ${{ vars.STATUS_API_URL }}
        run: |
          set -euo pipefail
          if [ -z "${STATUS_API_URL:-}" ]; then
            echo "::error::Set the repository variable STATUS_API_URL to the Worker origin, e.g. https://natune-status.<account>.workers.dev"
            exit 1
          fi
          tmp="$(mktemp)"
          if curl -fsS --retry 2 --max-time 20 "${STATUS_API_URL%/}/api/listeners/active" -o "$tmp"; then
            python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$tmp"
            mv "$tmp" docs/status.json
          else
            # Keep the previous snapshot on API failure: the dashboard shows its updatedAt as stale
            # instead of an empty map, and this job stays green.
            echo "::warning::Aggregate fetch failed; keeping previous docs/status.json"
            rm -f "$tmp"
            exit 0
          fi

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- docs/status.json; then
            echo "No change"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/status.json
          git commit -m "chore: refresh listener snapshot"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  pages:
    needs: snapshot
    if: needs.snapshot.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Checkout the commit the snapshot job just pushed (or github.sha when nothing changed), so the
      # Pages artifact carries the fresh status.json rather than the pre-run one.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.snapshot.outputs.sha }}

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
